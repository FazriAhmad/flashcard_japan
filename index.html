<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Jepang - Game Belajar</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <header>
            <div class="stats-container">
                <div class="stat-item" id="health-container">
                    <span class="icon">❤️</span>
                    <span id="health-count">3</span>
                </div>
                <div class="stat-item" id="score-container">
                    <span class="label">SCORE</span>
                    <span id="score-count">0</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="kana-nav-btn" class="secondary-btn" title="Belajar Huruf">あ Huruf</button>
                <button id="mute-toggle-btn" class="secondary-btn" title="Toggle Audio">🔊</button>
                <button id="mode-toggle-btn" class="secondary-btn">JP → ID</button>
            </div>
        </header>

        <main>
            <div id="game-screen" class="screen">
                <div class="flashcard-wrapper">
                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-inner">
                            <div class="flashcard-front">
                                <span id="reading-text">...</span>
                                <span id="display-text">...</span>
                                <button id="play-audio-btn" class="audio-btn">🔊</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="options-container" class="options-grid">
                    <!-- Tombol pilihan akan di-generate di sini -->
                </div>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <h1>GAME OVER</h1>
                <p>Skor Akhir Anda:</p>
                <div id="final-score">0</div>
                <button id="restart-btn" class="primary-btn">Main Lagi</button>
            </div>

            <!-- Belajar Huruf: Hiragana & Katakana -->
            <div id="kana-screen" class="screen hidden">
                <div class="kana-tabs">
                    <div class="toggle-group" id="kana-script-toggle">
                        <button class="toggle-btn active" data-script="hiragana">HIRAGANA</button>
                        <button class="toggle-btn" data-script="katakana">KATAKANA</button>
                    </div>
                    <div class="toggle-group" id="kana-view-toggle">
                        <button class="toggle-btn active" data-view="card">KARTU</button>
                        <button class="toggle-btn" data-view="table">TABEL</button>
                    </div>
                </div>

                <div class="kana-progress-row">
                    <span id="kana-progress">1 / 46</span>
                    <span id="kana-mastered-count">0 / 46 dikuasai</span>
                </div>

                <div id="kana-card-wrap" class="kana-card-wrap">
                    <div id="kana-flashcard" class="kana-flashcard">
                        <div class="kana-flashcard-inner">
                            <div class="kana-flashcard-face kana-flashcard-front" id="kana-front">あ</div>
                            <div class="kana-flashcard-face kana-flashcard-back" id="kana-back">a</div>
                        </div>
                    </div>
                    <button type="button" id="kana-master-btn" class="kana-master-btn">TANDAI HAFAL</button>
                    <div class="kana-controls">
                        <button type="button" id="kana-prev" class="kana-ctrl-btn" aria-label="Sebelumnya">◀</button>
                        <button type="button" id="kana-speak" class="kana-ctrl-btn" aria-label="Ucapkan">🔊</button>
                        <button type="button" id="kana-shuffle" class="kana-ctrl-btn" aria-label="Acak">🔀</button>
                        <button type="button" id="kana-next" class="kana-ctrl-btn" aria-label="Berikutnya">▶</button>
                    </div>
                    <p class="kana-hint">Klik kartu untuk membalik &amp; dengar pengucapan</p>
                </div>

                <div id="kana-table" class="kana-table"></div>

                <button type="button" id="kana-back-btn" class="secondary-btn kana-return-btn">← Kembali ke Kuis</button>
            </div>
        </main>
    </div>
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; <span id="year"></span> Fazri Ahmad .</p>
            <p class="attribution">
                Japanese pronunciation audio by <a href="http://www.wanikani.com" target="_blank"
                    rel="noopener">WaniKani</a> and <a href="https://www.tofugu.com" target="_blank"
                    rel="noopener">Tofugu</a>.
            </p>
        </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/kana.js"></script>
</body>

</html>
